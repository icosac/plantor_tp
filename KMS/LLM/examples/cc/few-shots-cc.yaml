entries:
  system_msg:
    role: 'system'
    content: "Your role is to do a consistency check on the description of the environment and of 
      the task. Think silently. Return a verdict (OK or PROBLEM) and a very short explanation 
      (1-2 sentences). Do not output chain-of-thought or step-by-step reasoning."
  files: 
    - "hl.yaml"
    - "ll.yaml"
