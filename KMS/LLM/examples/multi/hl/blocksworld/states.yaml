    ###############################     6     ##################################
    ############################################################################
    6: 
      Q:
        role: 'user'
        content: |
          There are 3 blocks on the table, two regular blocks and one elongated block for the arch.
          Our goal is to create an arch by moving the two support blocks to their support positions
          and then placing the architrave on top of them. The positions available are as follows:
          - (1, 1)
          - (2, 2)
          - (3, 4)
          - (5, 5)
          - (9, 9)
          - (1.5, 1.5)
          Initially, the blocks are free and the agents are available. 
          Moreover, one block is in position (3, 4), another is in position (5, 5) and the architrave is in 
          position (9, 9). We want to place the first support block at (1, 1), the second support block at (2, 2) and the 
          architrave on top of them. There are two agents that can carry out this task, namely a1 and a2. 
          They are free both at the beginning and at the end of the scenario. 
          We want to use block1 as the first support block, block2 as the second support block, and arch1 as the architrave. 
          Also the knowledge base extracted before is the following:
          ```KB
          :- discontiguous resources/1.
          
          % blocks
          block(block1).
          block(block2).
          block(arch1).
          architrave(arch1).

          % agents
          agent(a1).
          agent(a2).

          % positions
          pos(1, 1).
          pos(2, 2).
          pos(3, 4).
          pos(5, 5).
          pos(9, 9).
          pos(1.5, 1.5).

          % resources
          resources(agent(_)).
          ```
          Can you provide the initial and final states?
      A:
        role: 'assistant'
        content: |
          Sure. The description states that at the beginning we have 3 blocks that are clear and on the table.
          Also, it states that the agents are available and can be used. The blocks are positioned
          in (3, 4), (5, 5), and (9, 9), respectively.
          ```init
          init_state([
            ontable(block1), ontable(block2), ontable(arch1),
            at(block1,3,4), at(block2,5,5), at(arch1,9,9),
            clear(block1), clear(block2), clear(arch1),
            available(a1), available(a2)
          ]).
          ```
          At the end, the support blocks are represented by their target positions and the architrave is
          represented with normal Blocks World `on/2` relations over both supports. The architrave remains
          clear and the agents are available.
          ```goal
          goal_state([
            ontable(block1), ontable(block2),
            on(arch1, block1), on(arch1, block2),
            at(block1,1,1), at(block2,2,2), at(arch1,1.5,1.5),
            clear(arch1),
            available(a1), available(a2)
          ]).
          ```
    ############################################################################
    ###############################     7     ##################################
    ############################################################################
    7: 
      Q:
        role: 'user'
        content: |
          In this scenario, we want to construct an arch using 3 blocks and a robotic arm. The blocks are
          initially distributed on the table in positions (32,60), (113,83), and (44,40). Blocks b1 and b2 have 
          dimensions 1x1x1 whereas b3 is longer and is considered as an architrave. The goal is to move
          the two support blocks b1 and b2 to positions (86,52) and (72,52), respectively, and place b3 on top of 
          them as an architrave in position (79, 52). There are two agents that can:
          - from a position on the table to another position on the table;
          - from a position on the table, to the top of another block;
          - from the top of a block, to a position on the table;
          - from the top of a block, to the top of another block.
          The action to place the last block on top as an architrave should be handled differently than these 
          moves as it must check that the two support blocks are at their target positions and clear. 
          The agents are available and can be used. The blocks are initially free and can be moved by the agents.
          Also the knowledge base extracted before is the following:
          ```KB
          % Positions
          pos(32,60).
          pos(113,83).
          pos(44,40).
          pos(86,52).
          pos(72,52).
          pos(79,52).

          % Blocks
          block(b1).
          block(b2).
          block(b3).
          architrave(b3).

          % Agents
          agent(a1).
          agent(a2).

          % Resources
          resources(agent(_)).
          ```
          Can you provide the initial and final states?

      A:
        role: 'assistant'
        content: |
          Sure. The description states that at the beginning we have 3 blocks that are free and that 
          we can use. Also, it states that the agents are available and can be used. The blocks 
          are positioned in (32,60), (113,83), and (44,40), respectively.
          ```init
          init_state([
            ontable(b1), ontable(b2), ontable(b3),
            at(b1,32,60), at(b2,113,83), at(b3,44,40),
            clear(b1), clear(b2), clear(b3),
            available(a1), available(a2)
          ]).
          ```
          At the end, the support blocks are represented by their target positions and the architrave is
          represented with normal Blocks World `on/2` relations over both supports. The architrave remains
          clear and the agents are available.
          ```goal
          goal_state([
            ontable(b1), ontable(b2),
            on(b3, b1), on(b3, b2),
            at(b1,86,52), at(b2,72,52), at(b3,79,52),
            clear(b3),
            available(a1), available(a2)
          ]).
          ```
